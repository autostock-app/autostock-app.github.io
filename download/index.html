<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Descargar AutoStock</title>
    <meta name="description" content="Redirección a la tienda correcta para descargar AutoStock" />
    <style>
        :root {
            color-scheme: light dark
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: #0d0d0f;
            color: #fff
        }

        .card {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12);
            padding: 28px 24px;
            border-radius: 16px;
            max-width: 560px;
            width: 92%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25)
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px
        }

        p {
            margin: 0 0 18px;
            opacity: .9
        }

        .links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px
        }

        a.badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #111;
            color: #fff;
            text-decoration: none
        }

        a.badge svg {
            width: 22px;
            height: 22px
        }

        .muted {
            font-size: 13px;
            opacity: .8;
            margin-top: 8px
        }

        code {
            background: rgba(255, 255, 255, .1);
            padding: 2px 6px;
            border-radius: 6px
        }

        /* QR selector UI */
        .qr-section {
            margin-top: 18px
        }

        .segmented {
            display: inline-flex;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .16);
            padding: 4px;
            border-radius: 12px
        }

        .segmented button {
            appearance: none;
            border: 0;
            background: transparent;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            opacity: .8
        }

        .segmented button.active {
            background: #111;
            opacity: 1;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .25)
        }

        .qr-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 14px
        }

        .qr-box {
            width: 220px;
            height: 220px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .04);
            border: 1px dashed rgba(255, 255, 255, .25);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .25)
        }

        .qr-box .qr-link {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
        }

        .qr-box img {
            width: 90%;
            height: 90%;
            object-fit: contain
        }

        .qr-caption {
            opacity: .85;
            font-size: 13px
        }

        .hidden {
            display: none !important
        }
    </style>
</head>

<body>
    <div class="card">
        <h1 id="page-title">Redirigiendo a tu tienda…</h1>
        <p id="page-desc">Si no te redirige automáticamente, elige tu tienda aquí:</p>
        <div class="links">
            <!-- Sustituye # por tus enlaces reales -->
            <a class="badge" id="appstore" href="#" aria-label="Abrir en App Store">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#fff"
                        d="M16.365 1.43c0 1.14-.467 2.245-1.234 3.074-.793.858-2.08 1.52-3.225 1.43-.155-1.107.45-2.272 1.21-3.09.793-.859 2.17-1.49 3.25-1.414zM21.5 17.01c-.588 1.36-1.32 2.62-2.297 3.77-.757.9-1.646 1.89-2.835 1.91-1.162.024-1.537-.62-2.86-.62-1.324 0-1.735.6-2.884.644-1.175.044-2.07-.98-2.83-1.878-1.542-1.86-2.73-4.677-2.86-7.345-.124-2.466.637-4.54 2.06-5.915.92-.885 2.15-1.48 3.4-1.5 1.198-.02 2.324.67 3.044.67.72 0 2.1-.825 3.54-.705.603.025 2.302.244 3.39 1.84-.086.055-2.026 1.19-2.004 3.55.022 2.836 2.48 3.78 2.52 3.8z" />
                </svg>
                <span>App Store</span>
            </a>
            <a class="badge" id="googleplay" href="#" aria-label="Abrir en Google Play">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <defs>
                        <linearGradient id="gp" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#34a853" />
                            <stop offset="100%" stop-color="#4285f4" />
                        </linearGradient>
                    </defs>
                    <path d="M3 2l18 10L3 22z" fill="url(#gp)" />
                </svg>
                <span>Google Play</span>
            </a>
        </div>
        <div class="qr-section" aria-live="polite">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <strong>Mostrar código QR</strong>
                <div class="segmented" role="tablist" aria-label="Seleccionar tienda para QR">
                    <button id="iosTab" class="active" role="tab" aria-selected="true"
                        aria-controls="qr-ios">iOS</button>
                    <button id="androidTab" role="tab" aria-selected="false" aria-controls="qr-android">Android</button>
                </div>
            </div>
            <div class="qr-panel">
                <div id="qr-ios" class="qr-box" role="tabpanel" aria-labelledby="iosTab">
                    <a id="qr-ios-link" class="qr-link" href="#" target="_blank" rel="noopener">
                        <img id="qr-ios-img" alt="Código QR iOS"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><rect x='6' y='6' width='208' height='208' rx='14' ry='14' fill='none' stroke='%23ffffff' stroke-width='2'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial, Helvetica, sans-serif' font-size='36'>QR iOS</text></svg>" />
                    </a>
                </div>
                <div id="qr-android" class="qr-box hidden" role="tabpanel" aria-labelledby="androidTab">
                    <a id="qr-android-link" class="qr-link" href="#" target="_blank" rel="noopener">
                        <img id="qr-android-img" alt="Código QR Android"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><rect x='6' y='6' width='208' height='208' rx='14' ry='14' fill='none' stroke='%23ffffff' stroke-width='2'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Arial, Helvetica, sans-serif' font-size='36'>QR AND</text></svg>" />
                    </a>
                </div>
                <div class="qr-caption">Escanéalo con tu cámara para descargar</div>
            </div>
        </div>
        <p class="muted">Tip: imprime esta página o comparte un único enlace a <code>/download/</code>.</p>
    </div>

    <script>
        (function () {
            // Configuración: reemplaza por tus URLs reales y rutas a QR (opcional)
            var CFG = {
                APP_STORE_URL: 'https://apps.apple.com/fr/app/auto-stock/id6710699044?l=en-GB',
                GOOGLE_PLAY_URL: 'https://play.google.com/store/apps/details?id=com.autostock.autostock.app&hl=es',
                QR_IOS_SRC: '/assets/images/qr.png',
                QR_ANDROID_SRC: '/assets/images/qr.png'
            };

            // Detección
            var ua = navigator.userAgent || navigator.vendor || window.opera || '';
            var params = new URLSearchParams(window.location.search);
            var qrMode = params.has('qr') && params.get('qr') !== '0';

            var isiOS = function (u) { return /iPad|iPhone|iPod/.test(u) || (/Macintosh/.test(u) && 'ontouchend' in document); };
            var isAndroid = function (u) { return /Android/.test(u); };
            var isMobile = function (u) { return isiOS(u) || isAndroid(u); };

            // DOM refs
            var el = {
                appstore: document.getElementById('appstore'),
                googleplay: document.getElementById('googleplay'),
                iosTab: document.getElementById('iosTab'),
                androidTab: document.getElementById('androidTab'),
                qrIosPanel: document.getElementById('qr-ios'),
                qrAndPanel: document.getElementById('qr-android'),
                qrIosImg: document.getElementById('qr-ios-img'),
                qrAndImg: document.getElementById('qr-android-img'),
                qrIosLink: document.getElementById('qr-ios-link'),
                qrAndLink: document.getElementById('qr-android-link'),
                title: document.getElementById('page-title'),
                desc: document.getElementById('page-desc')
            };

            function targetURL() {
                if (isiOS(ua)) return CFG.APP_STORE_URL;
                if (isAndroid(ua)) return CFG.GOOGLE_PLAY_URL;
                return null;
            }

            function updateBadges() {
                if (el.appstore) el.appstore.href = CFG.APP_STORE_URL;
                if (el.googleplay) el.googleplay.href = CFG.GOOGLE_PLAY_URL;
            }

            function setupQR() {
                if (el.qrIosLink) el.qrIosLink.href = CFG.APP_STORE_URL;
                if (el.qrAndLink) el.qrAndLink.href = CFG.GOOGLE_PLAY_URL;
                if (CFG.QR_IOS_SRC && CFG.QR_IOS_SRC !== '#') el.qrIosImg.src = CFG.QR_IOS_SRC;
                if (CFG.QR_ANDROID_SRC && CFG.QR_ANDROID_SRC !== '#') el.qrAndImg.src = CFG.QR_ANDROID_SRC;
            }

            function select(kind) {
                var showIOS = kind === 'ios';
                el.iosTab.classList.toggle('active', showIOS);
                el.iosTab.setAttribute('aria-selected', showIOS);
                el.androidTab.classList.toggle('active', !showIOS);
                el.androidTab.setAttribute('aria-selected', !showIOS);
                el.qrIosPanel.classList.toggle('hidden', !showIOS);
                el.qrAndPanel.classList.toggle('hidden', showIOS);
            }

            function bindTabs() {
                if (el.iosTab) el.iosTab.addEventListener('click', function () { select('ios'); });
                if (el.androidTab) el.androidTab.addEventListener('click', function () { select('android'); });
            }

            function updateTextsForQRMode() {
                if (el.title) el.title.textContent = 'Descarga AutoStock';
                if (el.desc) el.desc.textContent = 'Escanea el código o elige tu tienda:';
            }

            function maybeRedirect() {
                var t = targetURL();
                if (isMobile(ua) && t && t !== '#') window.location.replace(t);
            }

            // Init
            updateBadges();
            setupQR();
            bindTabs();
            if (isiOS(ua)) {
                select('ios');
            } else if (isAndroid(ua)) {
                select('android');
            } else {
                select('ios');
            }
            if (qrMode) updateTextsForQRMode(); else maybeRedirect();
        })();
    </script>
</body>

</html>
